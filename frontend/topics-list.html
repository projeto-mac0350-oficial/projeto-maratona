{% extends "base.html" %}

{% block title %}
MaratonUSP Ensina - Conteúdos
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="topics-list.css">
<link rel="stylesheet" href="progress-bar.css">
{% endblock %}

{% block content %}

<div class="topics-list">
    <h1 id="topics-list-title"></h1>
    <div class="topics-grid" id="topics-grid">
        <p class="topics-status" id="topics-status">Carregando…</p>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="./progress-bar.js"></script>
<script>
/*
 * Two modes, chosen by the ?level=<slug> query param:
 *  - no level: shows a chooser card per level (from GET /levels), each
 *    linking to /conteudos?level=<slug>.
 *  - level given: fetches GET /levels/<slug> (level + its topics) and
 *    renders one card per topic, linking to /conteudo?topic=<slug>, each
 *    with a "problemas feitos / total" bar right under the title (via the
 *    shared progress-bar.js, same module the profile page uses).
 */
(async () => {
    const titleEl = document.getElementById("topics-list-title");
    const grid = document.getElementById("topics-grid");
    const status = document.getElementById("topics-status");

    function fail(message) {
        status.textContent = message;
    }

    async function renderLevelChooser() {
        let levels;
        try {
            const res = await fetch("/levels", { credentials: "same-origin" });
            if (!res.ok) throw new Error("request failed");
            levels = await res.json();
        } catch (err) {
            fail("Não foi possível carregar os níveis.");
            return;
        }
        if (!levels.length) {
            fail("Nenhum nível disponível ainda.");
            return;
        }
        status.remove();
        levels.forEach((level) => {
            const card = document.createElement("a");
            card.className = "topic-card";
            card.href = `/conteudos?level=${encodeURIComponent(level.slug)}`;

            const title = document.createElement("div");
            title.className = "topic-card-title";
            title.textContent = level.title;
            card.appendChild(title);

            grid.appendChild(card);
        });
    }

    async function renderTopicCards(topics) {
        if (!topics.length) {
            fail("Nenhum conteúdo disponível ainda neste nível.");
            return;
        }
        status.remove();

        // Sem login isso dá 401 e cai no catch — as barras simplesmente não
        // aparecem, os cards continuam normais (mesmo comportamento que os
        // toggles "Lido"/"AC" têm hoje em topic.html sem sessão).
        let progress = {};
        try {
            const res = await fetch("/progress", { credentials: "same-origin" });
            if (res.ok) progress = await res.json();
        } catch (err) {
            /* mantém vazio */
        }

        const totais = await Promise.all(
            topics.map((topic) => window.ProgressBar.totalProblemas(topic.slug))
        );

        topics.forEach((topic, i) => {
            const card = document.createElement("a");
            card.className = "topic-card";
            card.href = `/conteudo?topic=${encodeURIComponent(topic.slug)}`;

            const title = document.createElement("div");
            title.className = "topic-card-title";
            title.textContent = topic.title;
            card.appendChild(title);

            if (topic.summary) {
                const summary = document.createElement("p");
                summary.className = "topic-card-summary";
                summary.textContent = topic.summary;
                card.appendChild(summary);
            }

            const total = totais[i];
            if (total > 0) {
                const ac = window.ProgressBar.contarFeitos(progress, topic.slug);
                card.appendChild(window.ProgressBar.criarBarra(ac, total));
            }

            grid.appendChild(card);
        });
    }

    const levelSlug = new URLSearchParams(location.search).get("level");
    if (!levelSlug) {
        titleEl.textContent = "Conteúdos";
        await renderLevelChooser();
        return;
    }

    let level;
    try {
        const res = await fetch(`/levels/${encodeURIComponent(levelSlug)}`, {
            credentials: "same-origin",
        });
        if (res.status === 404) {
            fail("Nível não encontrado.");
            return;
        }
        if (!res.ok) throw new Error("request failed");
        level = await res.json();
    } catch (err) {
        fail("Não foi possível carregar os conteúdos.");
        return;
    }

    document.title = `${level.title} — Conteúdos — MaratonUSP Ensina`;
    titleEl.textContent = `${level.title}`;
    await renderTopicCards(level.topics);
})();
</script>
{% endblock %}

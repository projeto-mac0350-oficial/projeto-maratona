<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Maratonusp Ensina{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <link rel="icon"
      href="{{ url_for('static', filename='images/favicon.png') }}"
      type="image/png">

    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/auth-widget.css">
    <link rel="stylesheet" href="/logout-message.css">
    {% block extra_css %}{% endblock %}


    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved) {
                document.documentElement.setAttribute("data-theme", saved);
            }
        })();
    </script>
</head>

<body>

<header>
    <h1><a href="/">MaratonUSP Ensina</a></h1>

    <button id="menu-toggle" class="menu-toggle" type="button"
            aria-label="Abrir menu" aria-expanded="false" aria-controls="barra-navegacao">
        <svg class="icon-open" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg>
        <svg class="icon-close" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="currentColor"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
    </button>

    <nav class="barra-navegacao" id="barra-navegacao">
        <div class="head_botoes">
        
            <div class="nav-dropdown" id="niveis-dropdown">
                <button type="button" class="nav-button" id="niveis-toggle"
                        aria-haspopup="true" aria-expanded="false">
                    Níveis ▾ 
                </button>
                <div class="nav-dropdown-menu" id="niveis-menu" hidden></div>
            </div>
            <a href="/perfil" id="btn-logado" class="nav-button hidden">Dashboard</a>
            <a href="/admin" id="btn-admin" class="nav-button hidden">Admin</a>

            <!-- Login/logout control injected by auth-widget.js -->
            <div id="container-auth-controls"><span id="auth-controls"></span></div>
            
            <button id="theme-toggle" class="nav-button" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#0f172a"><path d="M480-28 346-160H160v-186L28-480l132-134v-186h186l134-132 134 132h186v186l132 134-132 134v186H614L480-28Zm0-252q83 0 141.5-58.5T680-480q0-83-58.5-141.5T480-680v400Zm0 140 100-100h140v-140l100-100-100-100v-140H580L480-820 380-720H240v140L140-480l100 100v140h140l100 100Zm0-340Z"/></svg>
            </button>
        </div>
    </nav>
</header>

<main id="conteudo">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    Maratonusp Ensina — MAC0350
</footer>

<script>
const root = document.documentElement;

/* --- Tema claro/escuro --------------------------------------------------- */
const themeToggle = document.getElementById("theme-toggle");

function refreshThemeLabel() {
    const dark = root.getAttribute("data-theme") === "dark";
    const lightIcon = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#0f172a"><path d="M480-28 346-160H160v-186L28-480l132-134v-186h186l134-132 134 132h186v186l132 134-132 134v186H614L480-28Zm0-252q83 0 141.5-58.5T680-480q0-83-58.5-141.5T480-680v400Zm0 140 100-100h140v-140l100-100-100-100v-140H580L480-820 380-720H240v140L140-480l100 100v140h140l100 100Zm0-340Z"/></svg>';
    const darkIcon = '<svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M480-28 346-160H160v-186L28-480l132-134v-186h186l134-132 134 132h186v186l132 134-132 134v186H614L480-28Zm0-252q83 0 141.5-58.5T680-480q0-83-58.5-141.5T480-680v400Zm0 140 100-100h140v-140l100-100-100-100v-140H580L480-820 380-720H240v140L140-480l100 100v140h140l100 100Zm0-340Z"/></svg>';
    themeToggle.innerHTML = dark ? darkIcon : lightIcon;
}

themeToggle.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    refreshThemeLabel();
});

refreshThemeLabel();

/* --- Menu hambúrguer (mobile) --------------------------------------------- */
const menuToggle = document.getElementById("menu-toggle");
const barraNavegacao = document.getElementById("barra-navegacao");

function setMobileMenu(open) {
    barraNavegacao.classList.toggle("is-open", open);
    menuToggle.classList.toggle("is-open", open);
    menuToggle.setAttribute("aria-expanded", String(open));
    menuToggle.setAttribute("aria-label", open ? "Fechar menu" : "Abrir menu");
}

menuToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    setMobileMenu(!barraNavegacao.classList.contains("is-open"));
});

// Fecha o menu mobile ao clicar fora dele
document.addEventListener("click", (e) => {
    if (barraNavegacao.classList.contains("is-open") &&
        !barraNavegacao.contains(e.target) &&
        e.target !== menuToggle) {
        setMobileMenu(false);
    }
});

// Fecha o menu mobile ao clicar em algum link (exceto o dropdown de níveis)
barraNavegacao.addEventListener("click", (e) => {
    const link = e.target.closest("a");
    if (link) setMobileMenu(false);
});

// Se a tela for redimensionada para desktop, garante que o menu não fique "preso" aberto
window.addEventListener("resize", () => {
    if (window.innerWidth > 860 && barraNavegacao.classList.contains("is-open")) {
        setMobileMenu(false);
    }
});

/* --- Menu "Níveis": busca as opções em /levels e monta o dropdown --------- */
const niveisToggle = document.getElementById("niveis-toggle");
const niveisMenu = document.getElementById("niveis-menu");
let niveisLoaded = false;

async function loadNiveisMenu() {
    try {
        const res = await fetch("/levels", { credentials: "same-origin" });
        if (!res.ok) throw new Error("request failed");
        const levels = await res.json();
        niveisMenu.innerHTML = "";
        if (!levels.length) {
            niveisMenu.innerHTML = '<span class="nav-dropdown-status">Nenhum nível ainda</span>';
            return;
        }
        levels.forEach((level) => {
            const a = document.createElement("a");
            a.href = `/conteudos?level=${encodeURIComponent(level.slug)}`;
            a.textContent = level.title;
            niveisMenu.appendChild(a);
        });
        niveisLoaded = true;
    } catch (err) {
        niveisMenu.innerHTML = '<span class="nav-dropdown-status">Não foi possível carregar</span>';
    }
}

niveisToggle.addEventListener("click", (e) => {
    e.stopPropagation();
    const willOpen = niveisMenu.hidden;
    niveisMenu.hidden = !willOpen;
    niveisToggle.setAttribute("aria-expanded", String(willOpen));
    if (willOpen && !niveisLoaded) loadNiveisMenu();
});

document.addEventListener("click", (e) => {
    if (!niveisMenu.hidden && !niveisMenu.contains(e.target) && e.target !== niveisToggle) {
        niveisMenu.hidden = true;
        niveisToggle.setAttribute("aria-expanded", "false");
    }
});


</script>

<script src="/auth-widget.js"></script>
<script src="/logout-message.js"></script>

{% block extra_js %}{% endblock %}

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Maratonusp Ensina{% endblock %}</title>

    <link rel="stylesheet" href="./base.css">
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./auth-widget.css">
    {% block extra_css %}{% endblock %}

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
        (function () {
            var saved = localStorage.getItem("theme");
            if (saved) {
                document.documentElement.setAttribute("data-theme", saved);
            }
        })();
    </script>
</head>

<body>

<header>
    <h1><a href="/">MaratonUSP Ensina</a></h1>

    <nav class="barra-navegacao">
        <div class="head_botoes">
            <!-- Login/logout control injected by auth-widget.js -->
            <span id="auth-controls"></span>
            <a href="/" class="nav-button">Início</a>
            <a href="/programacao_junior" class="nav-button">Níveis</a>
            <a href="/perfil" id="btn-logado" class="nav-button hidden">Perfil</a>
            <button id="theme-toggle" type="button">🌙 Escuro</button>
        </div>
    </nav>
</header>

<main id="conteudo">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
    Maratonusp Ensina — MAC0350
</footer>

<script>
const root = document.documentElement;

/* --- Tema claro/escuro --------------------------------------------------- */
const themeToggle = document.getElementById("theme-toggle");

function refreshThemeLabel() {
    const dark = root.getAttribute("data-theme") === "dark";
    themeToggle.textContent = dark ? "☀️ Claro" : "🌙 Escuro";
}

themeToggle.addEventListener("click", () => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("theme", next);
    refreshThemeLabel();
});

refreshThemeLabel();

/* --- Painel do usuário: reage ao login/logout do auth-widget -------------- */
const accountCard = document.getElementById("account-card");
const btnLogado = document.getElementById("btn-logado");

window.addEventListener("auth:change", (e) => {
    const user = e.detail.user;

  
    if (user) {
        document.getElementById("account-username").textContent = user.username;
        accountCard.classList.remove("hidden");
    } else {
        accountCard.classList.add("hidden");
    }
});
</script>

<script src="./calendar.js"></script>
<script src="./auth-widget.js"></script>

</body>
</html>
